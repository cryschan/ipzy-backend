spring:
  application:
    name: ipzy-backend
  config:
    import: optional:file:.env[.properties]

  data:
    web:
      pageable:
        one-indexed-parameters: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ipzy_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
    open-in-view: false

  # Spring Security OAuth2 Client 설정
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${FRONTEND_URL:http://localhost:5173}/api/auth/kakao/callback
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
              - account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 앱 설정
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  oauth2:
    success-redirect-uri: ${FRONTEND_URL:http://localhost:5173}/auth/callback
    failure-redirect-uri: ${FRONTEND_URL:http://localhost:5173}/auth/callback?error=true
    logout-redirect-uri: ${FRONTEND_URL:http://localhost:5173}
  swagger:
    server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}

  quiz:
    session:
      # QuizSession 초기화 모드 설정
      # CLEAN: 기존 QuizSession 데이터를 모두 삭제하고 새로 생성
      # APPEND: 기존 QuizSession 데이터를 유지하고 추가로 생성
      # SKIP: 기존 QuizSession 데이터가 있으면 초기화하지 않음 (기본값)
      init-mode: ${QUIZ_SESSION_INIT_MODE:SKIP}
      cleanup:
        # 스케줄러 활성화 여부
        enabled: ${QUIZ_SESSION_CLEANUP_ENABLED:true}
        # Cron 표현식 (매일 오전 4시 실행)
        # 환경 변수 QUIZ_SESSION_CLEANUP_CRON이 설정되어 있으면 사용, 없으면 기본값 사용
        cron: ${QUIZ_SESSION_CLEANUP_CRON:0 0 4 * * *}
        # 만료 시간 (PT1H = 1시간, PT30M = 30분, PT24H = 24시간)
        expiration: ${QUIZ_SESSION_CLEANUP_EXPIRATION:PT5M}

# AI 서비스 설정
ai:
  python:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: 5000
    read-timeout: 60000

logging:
  level:
    root: INFO
    com.ipzy: DEBUG
    org.hibernate.SQL: DEBUG

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework  # 프록시(Vercel 등) X-Forwarded-* 헤더 처리
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: false # 로컬 개발용 (HTTP)
        same-site: lax

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: create-drop
---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

server:
  servlet:
    session:
      cookie:
        secure: true # 프로덕션 HTTPS 필수
        same-site: none # Cross-Origin 쿠키 허용

logging:
  level:
    root: WARN
    com.ipzy: DEBUG
