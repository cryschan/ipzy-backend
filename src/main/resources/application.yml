spring:
  application:
    name: ipzy-backend
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ipzy_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

  # Spring Security OAuth2 Client 설정
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/api/auth/kakao/callback"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
              - account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 앱 설정
app:
  oauth2:
    success-redirect-uri: ${FRONTEND_URL:http://localhost:5173}
    failure-redirect-uri: ${FRONTEND_URL:http://localhost:5173}/auth/callback?error=true
    logout-redirect-uri: ${FRONTEND_URL:http://localhost:5173}
  swagger:
    server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}
  quiz:
    session:
      cleanup:
        # 스케줄러 활성화 여부
        enabled: ${QUIZ_SESSION_CLEANUP_ENABLED:true}
        # Cron 표현식 (매일 오전 4시 실행)
        cron: ${QUIZ_SESSION_CLEANUP_CRON:0 0 4 * * *}
        # 만료 시간 (PT1H = 1시간, PT30M = 30분, PT24H = 24시간)
        expiration: ${QUIZ_SESSION_CLEANUP_EXPIRATION:PT1H}

# AI 서비스 설정
ai:
  python:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: 5000
    read-timeout: 10000

logging:
  level:
    root: INFO
    com.ipzy: DEBUG
    org.hibernate.SQL: DEBUG

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: false # 로컬 개발용 (HTTP)
        same-site: lax

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: create-drop
---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

server:
  servlet:
    session:
      cookie:
        secure: true # 프로덕션 HTTPS 필수

logging:
  level:
    root: WARN
    com.ipzy: DEBUG
