spring:
  application:
    name: ipzy-backend
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ipzy_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

  # Spring Security OAuth2 Client 설정
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/api/auth/kakao/callback"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 앱 설정
app:
  oauth2:
    success-redirect-uri: ${FRONTEND_URL:http://localhost:5173}/auth/callback
    failure-redirect-uri: ${FRONTEND_URL:http://localhost:5173}/auth/callback?error=true

logging:
  level:
    root: INFO
    com.ipzy: DEBUG
    org.hibernate.SQL: DEBUG

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false  # 로컬 개발용 (HTTP)
        same-site: lax

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: create-drop

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

server:
  servlet:
    session:
      cookie:
        secure: true  # 프로덕션 HTTPS 필수

logging:
  level:
    root: WARN
    com.ipzy: DEBUG
